<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Control de Stock — Ferretería</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#23262A">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    --concreto: #EDEAE2; --acero: #23262A; --acero-claro: #33373C;
    --amarillo: #F5B700; --alerta: #C1440E; --ok: #4C7A50; --azul-gps: #2E6E8E;
    --tinta: #1A1D1F; --tinta-suave: #6B6B66; --borde: #D8D4C8;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background: var(--concreto); color: var(--tinta); font-family:'Inter', sans-serif; padding-bottom:3rem; }
/* =============================================================================================================================================================================================
	.btn-scan → el botón "Escanear" de la barra de búsqueda
	.btn-salir → "Salir" y "+ Producto" del header
	.stepper button → los botones +/- de cantidad
	.link-editar / .link-eliminar → los links "Editar" y "Eliminar" de cada ficha
	.btn-guardar → "Guardar producto" / "Guardar cambios"
	.btn-cancelar → "Cancelar" del formulario
	.btn-marcar-gps / .btn-quitar-gps → los de GPS dentro del formulario

	En cada una podés cambiar background (color de fondo), 
	color (color de letra), 
	border-radius (redondez), 
	padding (tamaño),
	font-size, etc. 

	— usá los mismos nombres de variables que ya están arriba de todo (var(--amarillo), var(--acero), etc.) si querés mantener la paleta consistente.

	Para agregar un botón nuevo, se hace en dos partes:

		1) En el HTML (o dentro de un return en JavaScript que arma una ficha/formulario), 
			agregás la etiqueta, por ejemplo: <button class="btn-salir" onclick="miFuncion()">Texto</button>
		2) Si el botón tiene que hacer algo, escribís una función nueva en el <script> con ese mismo nombre (function miFuncion(){ ... }) 
			— igual que están armadas cambiarStock, eliminarProducto, etc., que podés usar de modelo.
 ============================================================================================================================================================================================= */ 

header{ background: var(--acero); color:#fff; padding:1.4rem 1.2rem 1.6rem; position:relative; overflow:hidden; }
  header::after{ content:""; position:absolute; left:0; right:0; bottom:0; height:6px;
    background: repeating-linear-gradient(-45deg, var(--amarillo) 0 14px, var(--acero) 14px 28px); }
  header h1{ font-family:'Oswald', sans-serif; font-size:1.6rem; letter-spacing:0.03em; text-transform:uppercase; }
  header p{ color:#B9B9B4; font-size:0.85rem; margin-top:2px; }
  .header-fila{ display:flex; justify-content:space-between; align-items:flex-start; }
  .btn-salir{ background:(var(--amarillo); border:1px solid #555; color:#B9B9B4; font-size:0.72rem; padding:0.3rem 0.6rem; border-radius:4px; cursor:pointer; }

  .login-wrap{ max-width:340px; margin:3rem auto; padding:0 1.2rem; }
  .login-wrap h2{ font-family:'Oswald', sans-serif; text-transform:uppercase; margin-bottom:0.8rem; }
  .login-wrap input{ width:100%; padding:0.7rem; margin-bottom:0.6rem; border:1px solid var(--borde); border-radius:5px; font-family:'IBM Plex Mono', monospace; font-size:0.85rem; }
  .login-wrap button{ width:100%; padding:0.7rem; background:var(--acero); color:var(--amarillo); border:none; border-radius:5px; font-weight:600; cursor:pointer; }
  .login-error{ color:var(--alerta); font-size:0.78rem; margin-top:0.5rem; min-height:1em; }

  .buscador-wrap{ padding:1rem 1.2rem 0; }
  .buscador{ display:flex; align-items:center; background:#fff; border:1px solid var(--borde); border-radius:6px; padding:0.7rem 0.9rem; gap:0.6rem; }
  .buscador input{ border:none; outline:none; flex:1; font-family:'IBM Plex Mono', monospace; font-size:0.95rem; color:var(--tinta); background:transparent; }
  .buscador input::placeholder{ color:#B0AFA8; }
  .btn-scan{ border:none; background:var(--amarillo); color:var(--tinta); font-weight:600; font-size:0.8rem; padding:0.6rem 0.8rem; border-radius:5px; cursor:pointer; white-space:nowrap; }

  .filtros{ display:flex; gap:0.5rem; padding:0.9rem 1.2rem 0; overflow-x:auto; }
  .chip{ flex-shrink:0; font-family:'IBM Plex Mono', monospace; font-size:0.78rem; padding:0.4rem 0.8rem; border-radius:999px; border:1px solid var(--borde); background:#fff; color:var(--tinta-suave); cursor:pointer; }
  .chip.activo{ background:var(--acero); color:var(--amarillo); border-color:var(--acero); }

  .resumen{ display:grid; grid-template-columns:repeat(3,1fr); gap:0.6rem; padding:1rem 1.2rem 0; }
  .metrica{ background:#fff; border:1px solid var(--borde); border-radius:6px; padding:0.6rem 0.7rem; }
  .metrica .num{ font-family:'IBM Plex Mono', monospace; font-size:1.25rem; font-weight:600; }
  .metrica .label{ font-size:0.68rem; color:var(--tinta-suave); text-transform:uppercase; letter-spacing:0.03em; }
  .metrica.alerta .num{ color:var(--alerta); }

  .lista{ padding:1.1rem 1.2rem 0; display:flex; flex-direction:column; gap:0.7rem; }
  .ficha{ background:#fff; border:1px solid var(--borde); border-radius:6px; display:flex; overflow:hidden; }
  .ficha .ubicacion{ background:var(--acero); color:var(--amarillo); font-family:'IBM Plex Mono', monospace; font-weight:600; font-size:0.95rem; min-width:82px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0.4rem; gap:2px; }
  .ficha.bajo .ubicacion{ background:var(--alerta); color:#fff; }
  .ficha .ubicacion.gps{ background:var(--azul-gps); color:#fff; }
  .ficha.bajo .ubicacion.gps{ background:var(--alerta); }
  .ubicacion .precision{ font-size:0.6rem; font-weight:400; opacity:0.85; }
  .ficha .info{ flex:1; padding:0.7rem 0.85rem; min-width:0; }
  .ficha .nombre{ font-weight:600; font-size:0.92rem; }
  .ficha .categoria{ font-size:0.72rem; color:var(--tinta-suave); margin-top:1px; }
  /* =====================================================================      
	- width / height: tamaño del cuadrado de la miniatura (subilos a 60px, 80px, lo que quieras).

	- object-fit:cover: recorta la imagen para que llene el cuadrado sin deformarse (si querés que se vea completa aunque queden bordes vacíos, cambialo a contain).

	- border-radius: qué tan redondeadas son las esquinas (0 = cuadrada, 50% = círculo).

	- float:right: hace que quede a la derecha del texto — sacá esa línea si preferís que esté arriba del nombre en vez de al costado.
       ===================================================================== */ 
.ficha .foto-mini{ width:80px; height:60px; object-fit:cover; border-radius:35px; border:1px solid var(--borde); float:right; margin-left:0.5rem; }
  .ficha .atributos{ font-size:0.72rem; color:var(--tinta-suave); margin-top:3px; display:flex; flex-wrap:wrap; gap:0.3rem; }
  .ficha .atributos span{ background:var(--concreto); border-radius:4px; padding:0.1rem 0.4rem; }
  .ficha .fila-stock{ display:flex; align-items:center; justify-content:space-between; margin-top:0.5rem; flex-wrap:wrap; gap:0.4rem; }
  .ficha .cantidad{ font-family:'IBM Plex Mono', monospace; font-size:0.85rem; }
  .ficha .cantidad b{ font-size:1rem; }
  .ficha.bajo .cantidad b{ color:var(--alerta); }
  .ficha:not(.bajo) .cantidad b{ color:var(--ok); }
  .stepper{ display:flex; align-items:center; gap:0.4rem; }
  .stepper button{ width:26px; height:26px; border-radius:5px; border:1px solid var(--borde); background:var(--concreto); font-size:1rem; cursor:pointer; }
  .fila-links{ display:flex; flex-wrap:wrap; gap:0.6rem; margin-top:0.45rem; align-items:center; }
  .link-editar, .link-eliminar{ font-size:0.72rem; text-decoration:underline; cursor:pointer; background:none; border:none; padding:0; }
  .link-editar{ color:var(--azul-gps); }
  .link-eliminar{ color:var(--alerta); }
  .link-mapa, .link-pdf{ font-size:0.72rem; color:var(--azul-gps); text-decoration:underline; }
  .gps-extra{ font-size:0.7rem; color:var(--azul-gps); margin-top:3px; }

  .panel-edicion{ background:var(--concreto); border:1px dashed var(--borde); border-radius:6px; padding:0.8rem; margin-top:0.5rem; }
  .campo-label{ font-size:0.68rem; color:var(--tinta-suave); text-transform:uppercase; letter-spacing:0.03em; margin:0.5rem 0 0.2rem; }
  .campo-label:first-child{ margin-top:0; }
  .input-full{ width:100%; padding:0.55rem; border:1px solid var(--borde); border-radius:5px; font-size:0.85rem; margin-bottom:0.45rem; font-family:'Inter', sans-serif; }
  .input-full.mono{ font-family:'IBM Plex Mono', monospace; }
  .campos-2col{ display:flex; gap:0.5rem; }
  .campos-2col input{ flex:1; padding:0.55rem; border:1px solid var(--borde); border-radius:5px; font-family:'IBM Plex Mono', monospace; font-size:0.85rem; margin-bottom:0.45rem; }
  .btn-guardar{ margin-top:0.4rem; width:100%; padding:0.6rem; background:var(--acero); color:var(--amarillo); border:none; border-radius:5px; font-weight:600; font-size:0.8rem; cursor:pointer; }
  .btn-cancelar{ margin-top:0.4rem; width:100%; padding:0.5rem; background:none; color:var(--tinta-suave); border:1px solid var(--borde); border-radius:5px; font-size:0.78rem; cursor:pointer; }
  .btn-marcar-gps{ width:100%; padding:0.55rem; background:var(--azul-gps); color:#fff; border:none; border-radius:5px; font-weight:600; font-size:0.8rem; cursor:pointer; }
  .btn-quitar-gps{ width:100%; padding:0.4rem; background:none; color:var(--alerta); border:1px solid var(--alerta); border-radius:5px; font-size:0.75rem; cursor:pointer; margin-top:0.4rem; }
  .aviso-gps{ font-size:0.7rem; color:var(--tinta-suave); margin-top:0.5rem; line-height:1.4; }
  .preview-gps{ font-family:'IBM Plex Mono', monospace; font-size:0.75rem; background:#fff; border:1px solid var(--borde); border-radius:5px; padding:0.5rem; margin-top:0.4rem; }
  .preview-gps .margen{ color:var(--alerta); font-weight:600; }
  .archivo-actual{ font-size:0.72rem; color:var(--tinta-suave); margin:0.2rem 0 0.5rem; }

  .vacio{ text-align:center; color:var(--tinta-suave); font-size:0.85rem; padding:2rem 1rem; }
  .scan-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.85); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:50; }
  .scan-overlay video{ width:90%; max-width:420px; border-radius:8px; border:3px solid var(--amarillo); }
  .scan-overlay p{ color:#fff; margin-top:1rem; font-size:0.85rem; }
  .scan-overlay button{ margin-top:1.2rem; background:var(--amarillo); border:none; padding:0.6rem 1.2rem; border-radius:6px; font-weight:600; cursor:pointer; }

  .oculto{ display:none !important; }
</style>
</head>
<body>

  <div class="login-wrap" id="pantalla-login">
    <h2>Ingresar</h2>
    <input id="login-email" type="email" placeholder="Email" />
    <input id="login-pass" type="password" placeholder="Contraseña" />
    <button onclick="iniciarSesion()">Entrar</button>
    <div class="login-error" id="login-error"></div>
  </div>

  <div id="app" class="oculto">
    <header>
      <div class="header-fila">
        <div>
          <h1>Control de Stock</h1>
          <p>Ferretería · ubicación y cantidad en tiempo real</p>
        </div>
        <div style="display:flex; gap:0.4rem;">
          <button class="btn-salir oculto" id="btn-nuevo" onclick="abrirFormNuevo()">+ Producto</button>
          <button class="btn-salir" onclick="cerrarSesion()">Salir</button>
        </div>
      </div>
    </header>

    <!-- Panel para cargar o editar un producto. Oculto hasta que se use "+ Producto" o "Editar" -->
    <div class="oculto" id="panel-nuevo" style="padding:0.9rem 1.2rem 0;"></div>

    <div class="buscador-wrap">
      <div class="buscador">
        <input id="input-busqueda" type="text" placeholder="Buscar por nombre o código..." oninput="filtrar()" />
        <button class="btn-scan" onclick="abrirScanner()">Escanear</button>
      </div>
    </div>

    <div class="filtros" id="filtros"></div>

    <div class="resumen">
      <div class="metrica"><div class="num" id="resumen-total">0</div><div class="label">Productos</div></div>
      <div class="metrica"><div class="num" id="resumen-unidades">0</div><div class="label">Unidades totales</div></div>
      <div class="metrica alerta"><div class="num" id="resumen-bajos">0</div><div class="label">Stock bajo</div></div>
    </div>

    <div class="lista" id="lista"></div>
  </div>

  <script>
    /* =====================================================================
       CONEXIÓN A SUPABASE — pegá acá tus datos de Project Settings > API
       ===================================================================== */
    const SUPABASE_URL = "https://xqcrmxjfhceajsptrqax.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhxY3JteGpmaGNlYWpzcHRycWF4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NTU1MzAsImV4cCI6MjEwMjAzMTUzMH0.8PFXD_cmIK5RWSg5WpKP7z4hAKgsD3Gx2ciQC4vJAMw";

    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    if(SUPABASE_URL.includes("PEGA_ACA") || SUPABASE_ANON_KEY.includes("PEGA_ACA")){
      document.getElementById("login-error").textContent =
        "Todavía no pegaste tu SUPABASE_URL y SUPABASE_ANON_KEY en el código.";
    }

    // Nombre del bucket de Storage donde se guardan fotos y PDF de productos
    const BUCKET_ARCHIVOS = "productos-archivos";

    /* =====================================================================
       ======================  CAMPOS EXTRA DEL PRODUCTO  ===================
       -------------------------------------------------------------------
       ESTA ES LA PARTE QUE VOS VAS A EDITAR cuando quieras sumar o sacar
       datos del formulario de producto (por ejemplo "Talle" para ropa,
       "Nº / Medida" para tornillos, "Color", "Marca", lo que necesites).

       Cada producto puede tener rubros distintos, así que estos campos
       NO están fijos en la base de datos: se guardan todos juntos en una
       sola columna especial llamada "atributos" (tipo diccionario), y
       esta lista de acá es la que le dice al formulario cuáles mostrar.

       CÓMO AGREGAR UN CAMPO NUEVO:
       Copiá una línea de la lista y cambiá los dos valores:
         - clave: nombre corto interno, SIN espacios ni tildes (se usa
           para guardarlo en la base de datos). Ej: "color", "marca"
         - etiqueta: el texto que se va a ver en el formulario. Ej: "Color"
       Ejemplo para agregar "Color":
         { clave: "color", etiqueta: "Color" },

       CÓMO SACAR UN CAMPO:
       Borrá esa línea completa de la lista (con su { } y su coma).
       Los productos que ya tenían ese dato cargado no lo pierden en la
       base de datos, solo deja de mostrarse/pedirse en el formulario.

       CÓMO REORDENAR:
       El orden en que aparecen acá es el mismo orden en que se muestran
       en el formulario — simplemente cambiá el orden de las líneas.

       No hace falta tocar Supabase ni ninguna otra parte del código para
       estos cambios: solo esta lista.
       ===================================================================== */
    const CAMPOS_EXTRA = [
      { clave: "tipo",            etiqueta: "Tipo" },
      { clave: "detalle",         etiqueta: "Detalle" },
      { clave: "contenido_neto",  etiqueta: "Contenido neto" },
      { clave: "talle",           etiqueta: "Talle" },
      { clave: "numero_medida",   etiqueta: "N° / Medida" },
    ];
    /* ===================== FIN DE CAMPOS EXTRA ===================== */

    let productos = [];
    let pasilloActivo = "todos";
    let miRol = "lector";

    /* =====================================================================
       LOGIN
       ===================================================================== */
    async function iniciarSesion(){
      const email = document.getElementById("login-email").value.trim();
      const pass = document.getElementById("login-pass").value;
      const cajaError = document.getElementById("login-error");
      cajaError.textContent = "Conectando...";
      try{
        const { data, error } = await db.auth.signInWithPassword({ email, password: pass });
        if(error){
          cajaError.textContent = "Error: " + error.message;
          console.error("Error de login:", error);
          return;
        }
        cajaError.textContent = "";
        await cargarPerfilYArrancar();
      }catch(err){
        cajaError.textContent = "No se pudo conectar con la base de datos. Revisá SUPABASE_URL y SUPABASE_ANON_KEY en el código.";
        console.error("Excepción al conectar:", err);
      }
    }

    function cerrarSesion(){
      db.auth.signOut();
      location.reload();
    }

    async function cargarPerfilYArrancar(){
      const { data: sesion } = await db.auth.getUser();
      const { data: perfil } = await db.from("perfiles").select("rol").eq("id", sesion.user.id).single();
      miRol = perfil ? perfil.rol : "lector";

      document.getElementById("pantalla-login").classList.add("oculto");
      document.getElementById("app").classList.remove("oculto");
      if(miRol === "admin") document.getElementById("btn-nuevo").classList.remove("oculto");

      await cargarProductos();
      construirFiltros();
      filtrar();
    }

    (async () => {
      const { data } = await db.auth.getSession();
      if(data.session) await cargarPerfilYArrancar();
    })();

    async function cargarProductos(){
      const { data, error } = await db.from("productos").select("*").order("nombre");
      if(error){ alert("Error cargando productos: " + error.message); return; }
      productos = data;
    }

    /* =====================================================================
       FILTROS: ahora la ubicación por GPS es ADICIONAL a pasillo/estante,
       no reemplaza una a la otra. El chip "GPS" agrupa cualquier producto
       que tenga coordenadas marcadas, tenga o no también estante asignado.
       ===================================================================== */
    function construirFiltros(){
      const pasillos = [...new Set(productos.filter(p => p.pasillo).map(p => p.pasillo))];
      const hayGps = productos.some(p => p.lat != null);
      const contenedor = document.getElementById("filtros");
      contenedor.innerHTML = "";
      const opciones = ["todos", ...pasillos, ...(hayGps ? ["gps"] : [])];
      opciones.forEach(valor => {
        const chip = document.createElement("div");
        chip.className = "chip" + (valor === pasilloActivo ? " activo" : "");
        if(valor === "todos") chip.textContent = "Todos";
        else if(valor === "gps") chip.textContent = "Con GPS";
        else chip.textContent = "Pasillo " + valor;
        chip.onclick = () => { pasilloActivo = valor; construirFiltros(); filtrar(); };
        contenedor.appendChild(chip);
      });
    }

    function filtrar(){
      const texto = document.getElementById("input-busqueda").value.toLowerCase().trim();
      const resultado = productos.filter(p => {
        const coincideTexto = p.nombre.toLowerCase().includes(texto) || p.codigo.includes(texto);
        const coincideFiltro =
          pasilloActivo === "todos" ||
          (pasilloActivo === "gps" && p.lat != null) ||
          (p.pasillo === pasilloActivo);
        return coincideTexto && coincideFiltro;
      });
      renderizar(resultado);
    }

    /* =====================================================================
       Dibuja la lista de productos. Cada ficha ahora puede mostrar, al
       mismo tiempo: estante/pasillo, GPS, foto, PDF y los campos extra
       definidos en CAMPOS_EXTRA (solo los que ese producto tenga cargados)
       ===================================================================== */
    function renderizar(lista){
      const contenedor = document.getElementById("lista");
      const soyAdmin = miRol === "admin";

      if(lista.length === 0){
        contenedor.innerHTML = '<div class="vacio">No se encontró ningún producto.</div>';
      } else {
        contenedor.innerHTML = lista.map(p => {
          const bajo = p.cantidad <= p.minimo;
          const tieneGps = p.lat != null;
          const tieneEstante = p.pasillo && p.estante;

          // Etiqueta principal de ubicación: estante si lo tiene, si no GPS, si no "s/u"
          let etiquetaUbicacion;
          if(tieneEstante){
            etiquetaUbicacion = `<div class="ubicacion">P${p.pasillo}<br>${p.estante}</div>`;
          } else if(tieneGps){
            etiquetaUbicacion = `<div class="ubicacion gps">GPS<span class="precision">±${Math.round(p.precision_gps)}m</span></div>`;
          } else {
            etiquetaUbicacion = `<div class="ubicacion" style="opacity:0.5;">S/U</div>`;
          }
          if(bajo) etiquetaUbicacion = etiquetaUbicacion.replace('class="ubicacion', 'class="ubicacion');

          // Si tiene estante Y ADEMÁS gps, mostramos la referencia GPS aparte, abajo
          const lineaGpsExtra = (tieneEstante && tieneGps)
            ? `<div class="gps-extra">📍 GPS ±${Math.round(p.precision_gps)}m · <a class="link-mapa" href="https://www.google.com/maps?q=${p.lat},${p.lng}" target="_blank">Ver en mapa</a></div>`
            : (tieneGps ? `` : ``);
          // Si el único dato de ubicación es GPS, el link a mapa va en la fila de links de abajo
          const linkMapaSolo = (!tieneEstante && tieneGps)
            ? `<a class="link-mapa" href="https://www.google.com/maps?q=${p.lat},${p.lng}" target="_blank">Ver en mapa</a>`
            : "";

          const linkPdf = p.pdf_url ? `<a class="link-pdf" href="${p.pdf_url}" target="_blank">Ver PDF</a>` : "";
          const fotoMini = p.foto_url ? `<img class="foto-mini" src="${p.foto_url}" alt="">` : "";

          // Mostramos los campos extra que este producto tenga cargados (según CAMPOS_EXTRA)
          const atributosHtml = CAMPOS_EXTRA
            .filter(c => p.atributos && p.atributos[c.clave])
            .map(c => `<span>${c.etiqueta}: ${p.atributos[c.clave]}</span>`)
            .join("");

          const controlesEdicion = soyAdmin ? `
            <div class="stepper">
              <button onclick="cambiarStock('${p.id}', -1)">-</button>
              <button onclick="cambiarStock('${p.id}', 1)">+</button>
            </div>` : "";
          const linksAdmin = soyAdmin ? `
              <button class="link-editar" onclick="abrirFormEditar('${p.id}')">Editar</button>
              <button class="link-eliminar" onclick="eliminarProducto('${p.id}')">Eliminar</button>
          ` : "";

          return `
            <div class="ficha ${bajo ? "bajo" : ""}">
              ${etiquetaUbicacion}
              <div class="info">
                ${fotoMini}
                <div class="nombre">${p.nombre}</div>
                <div class="categoria">${p.categoria || ""} · ${p.codigo}</div>
                ${atributosHtml ? `<div class="atributos">${atributosHtml}</div>` : ""}
                ${lineaGpsExtra}
                <div class="fila-stock">
                  <div class="cantidad">Stock: <b>${p.cantidad}</b> / mín. ${p.minimo}</div>
                  ${controlesEdicion}
                </div>
                <div class="fila-links">
                  ${linkMapaSolo}
                  ${linkPdf}
                  ${linksAdmin}
                </div>
              </div>
            </div>
          `;
        }).join("");
      }
      actualizarResumen(lista);
    }

    function actualizarResumen(lista){
      const totalUnidades = lista.reduce((suma, p) => suma + p.cantidad, 0);
      const bajos = lista.filter(p => p.cantidad <= p.minimo).length;
      document.getElementById("resumen-total").textContent = lista.length;
      document.getElementById("resumen-unidades").textContent = totalUnidades;
      document.getElementById("resumen-bajos").textContent = bajos;
    }

    async function cambiarStock(id, delta){
      const producto = productos.find(p => p.id === id);
      if(!producto) return;
      const nuevaCantidad = Math.max(0, producto.cantidad + delta);
      producto.cantidad = nuevaCantidad;
      filtrar();
      const { error } = await db.from("productos").update({ cantidad: nuevaCantidad }).eq("id", id);
      if(error) alert("No se pudo guardar el cambio de stock: " + error.message);
    }

    /* =====================================================================
       FORMULARIO DE PRODUCTO (uno solo, se usa tanto para "+Producto" como
       para "Editar" — cambia según formModo)
       ===================================================================== */
    let formModo = "nuevo";        // "nuevo" o "editar"
    let formProductoId = null;     // id del producto si estamos editando
    let formGps = null;            // {lat,lng,precision} recién marcado en este formulario
    let formGpsExistente = null;   // gps que ya tenía el producto (si estamos editando)
    let formQuitarGps = false;     // true si el usuario tocó "Quitar ubicación GPS"
    let formFotoFile = null;       // archivo de foto elegido (si eligió uno nuevo)
    let formPdfFile = null;        // archivo de pdf elegido (si eligió uno nuevo)
    let formFotoUrlExistente = null;
    let formPdfUrlExistente = null;

    function abrirFormNuevo(){
      formModo = "nuevo";
      formProductoId = null;
      formGps = null; formGpsExistente = null; formQuitarGps = false;
      formFotoFile = null; formPdfFile = null;
      formFotoUrlExistente = null; formPdfUrlExistente = null;
      window._formValoresTemp = null;
      document.getElementById("panel-nuevo").classList.remove("oculto");
      dibujarFormProducto();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function abrirFormEditar(id){
      const p = productos.find(p => p.id === id);
      if(!p) return;
      formModo = "editar";
      formProductoId = id;
      formGps = null;
      formGpsExistente = (p.lat != null) ? { lat: p.lat, lng: p.lng, precision: p.precision_gps } : null;
      formQuitarGps = false;
      formFotoFile = null; formPdfFile = null;
      formFotoUrlExistente = p.foto_url || null;
      formPdfUrlExistente = p.pdf_url || null;
      window._formValoresTemp = {
        codigo: p.codigo, nombre: p.nombre, categoria: p.categoria || "",
        cantidad: p.cantidad, minimo: p.minimo,
        pasillo: p.pasillo || "", estante: p.estante || "",
        atributos: { ...(p.atributos || {}) }
      };
      document.getElementById("panel-nuevo").classList.remove("oculto");
      dibujarFormProducto();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function cerrarForm(){
      document.getElementById("panel-nuevo").classList.add("oculto");
      document.getElementById("panel-nuevo").innerHTML = "";
    }

    // Guarda lo que hay tipeado en el formulario antes de redibujarlo
    // (se llama antes de marcar GPS, para no perder lo ya escrito)
    function capturarValoresForm(){
      const g = (id) => document.getElementById(id);
      const atributos = {};
      CAMPOS_EXTRA.forEach(c => {
        const el = g("extra-" + c.clave);
        if(el) atributos[c.clave] = el.value.trim();
      });
      window._formValoresTemp = {
        codigo: g("form-codigo") ? g("form-codigo").value : "",
        nombre: g("form-nombre") ? g("form-nombre").value : "",
        categoria: g("form-categoria") ? g("form-categoria").value : "",
        cantidad: g("form-cantidad") ? g("form-cantidad").value : "",
        minimo: g("form-minimo") ? g("form-minimo").value : "",
        pasillo: g("form-pasillo") ? g("form-pasillo").value : "",
        estante: g("form-estante") ? g("form-estante").value : "",
        atributos
      };
    }

    function dibujarFormProducto(){
      const v = window._formValoresTemp || {};
      const esEdicion = formModo === "editar";

      // Bloque de campos extra: uno por cada entrada de CAMPOS_EXTRA
      const bloqueAtributos = CAMPOS_EXTRA.map(c => `
        <div class="campo-label">${c.etiqueta}</div>
        <input id="extra-${c.clave}" class="input-full" type="text" value="${(v.atributos && v.atributos[c.clave]) || ""}" />
      `).join("");

      // Bloque de GPS: muestra el existente (si edita), o el recién marcado, o el botón para marcar
      let bloqueGps = "";
      if(formGps){
        bloqueGps = `
          <div class="preview-gps">
            Lat: ${formGps.lat.toFixed(5)}, Lng: ${formGps.lng.toFixed(5)}<br>
            Margen de error: <span class="margen">±${Math.round(formGps.precision)} metros</span>
          </div>
          <button class="btn-marcar-gps" onclick="marcarGpsForm()" style="margin-top:0.4rem;">Volver a marcar</button>
        `;
      } else if(formGpsExistente && !formQuitarGps){
        bloqueGps = `
          <div class="preview-gps">
            Ya tiene GPS marcado — Lat: ${formGpsExistente.lat.toFixed(5)}, Lng: ${formGpsExistente.lng.toFixed(5)}
            (margen ±${Math.round(formGpsExistente.precision)}m)
          </div>
          <button class="btn-marcar-gps" onclick="marcarGpsForm()" style="margin-top:0.4rem;">Volver a marcar</button>
          <button class="btn-quitar-gps" onclick="quitarGpsForm()">Quitar ubicación GPS</button>
        `;
      } else {
        bloqueGps = `<button class="btn-marcar-gps" onclick="marcarGpsForm()">Marcar ubicación GPS aquí</button>`;
      }

      document.getElementById("panel-nuevo").innerHTML = `
        <div class="panel-edicion">
          <h3 style="font-family:'Oswald',sans-serif; text-transform:uppercase; margin-bottom:0.5rem;">
            ${esEdicion ? "Editar producto" : "Nuevo producto"}
          </h3>

          <div class="campo-label">Código / código de barras</div>
          <input id="form-codigo" class="input-full mono" type="text" value="${v.codigo || ""}" />

          <div class="campo-label">Nombre del producto</div>
          <input id="form-nombre" class="input-full" type="text" value="${v.nombre || ""}" />

          <div class="campo-label">Categoría</div>
          <input id="form-categoria" class="input-full" type="text" value="${v.categoria || ""}" />

          <div class="campo-label">Cantidad y stock mínimo</div>
          <div class="campos-2col">
            <input id="form-cantidad" type="number" placeholder="Cantidad" value="${v.cantidad ?? ""}" />
            <input id="form-minimo" type="number" placeholder="Stock mínimo" value="${v.minimo ?? ""}" />
          </div>

          <div class="campo-label">Ubicación por estante (opcional)</div>
          <div class="campos-2col">
            <input id="form-pasillo" type="text" placeholder="Pasillo" value="${v.pasillo || ""}" />
            <input id="form-estante" type="text" placeholder="Estante" value="${v.estante || ""}" />
          </div>

          <div class="campo-label">Ubicación por GPS (opcional — se suma a la de estante, no la reemplaza)</div>
          ${bloqueGps}
          <div class="aviso-gps">
            Margen típico de 5 a 15 metros al aire libre; puede ser mayor o no
            funcionar bajo techo. Parate en el lugar exacto antes de marcar.
          </div>

          <!-- ===== CAMPOS EXTRA (definidos en CAMPOS_EXTRA, arriba del todo del código) ===== -->
          ${bloqueAtributos}

          <div class="campo-label">Foto (opcional)</div>
          ${formFotoUrlExistente && !formFotoFile ? `<div class="archivo-actual">Ya tiene una foto cargada. Elegí otra para reemplazarla.</div>` : ""}
          <input id="form-foto" class="input-full" type="file" accept="image/*" onchange="formFotoFile = this.files[0]" />

          <div class="campo-label">PDF (opcional — ficha técnica, manual, etc.)</div>
          ${formPdfUrlExistente && !formPdfFile ? `<div class="archivo-actual">Ya tiene un PDF cargado. Elegí otro para reemplazarlo.</div>` : ""}
          <input id="form-pdf" class="input-full" type="file" accept="application/pdf" onchange="formPdfFile = this.files[0]" />

          <button class="btn-guardar" onclick="guardarFormProducto()">${esEdicion ? "Guardar cambios" : "Guardar producto"}</button>
          <button class="btn-cancelar" onclick="cerrarForm()">Cancelar</button>
        </div>
      `;
    }

    function marcarGpsForm(){
      if(!("geolocation" in navigator)){ alert("Este navegador no soporta geolocalización."); return; }
      capturarValoresForm();
      navigator.geolocation.getCurrentPosition(
        (posicion) => {
          formGps = { lat: posicion.coords.latitude, lng: posicion.coords.longitude, precision: posicion.coords.accuracy };
          formQuitarGps = false;
          dibujarFormProducto();
        },
        () => alert("No se pudo obtener la ubicación. Revisá los permisos de GPS."),
        { enableHighAccuracy: true }
      );
    }

    function quitarGpsForm(){
      capturarValoresForm();
      formGpsExistente = null;
      formGps = null;
      formQuitarGps = true;
      dibujarFormProducto();
    }

    // Sube un archivo al bucket de Storage y devuelve su URL pública
    async function subirArchivo(file, subcarpeta){
      if(!file) return null;
      const nombreArchivo = `${subcarpeta}/${Date.now()}_${file.name}`;
      const { error } = await db.storage.from(BUCKET_ARCHIVOS).upload(nombreArchivo, file);
      if(error){ alert("No se pudo subir el archivo: " + error.message); return null; }
      const { data } = db.storage.from(BUCKET_ARCHIVOS).getPublicUrl(nombreArchivo);
      return data.publicUrl;
    }

    async function guardarFormProducto(){
      const codigo = document.getElementById("form-codigo").value.trim();
      const nombre = document.getElementById("form-nombre").value.trim();
      const categoria = document.getElementById("form-categoria").value.trim();
      const cantidad = parseInt(document.getElementById("form-cantidad").value) || 0;
      const minimo = parseInt(document.getElementById("form-minimo").value) || 0;
      const pasillo = document.getElementById("form-pasillo").value.trim();
      const estante = document.getElementById("form-estante").value.trim();

      if(!codigo || !nombre){ alert("Completá al menos el código y el nombre."); return; }

      // Armamos el objeto de atributos extra a partir de CAMPOS_EXTRA
      const atributos = {};
      CAMPOS_EXTRA.forEach(c => {
        const val = document.getElementById("extra-" + c.clave).value.trim();
        if(val) atributos[c.clave] = val;
      });

      const registro = {
        codigo, nombre, categoria, cantidad, minimo,
        pasillo: pasillo || null,
        estante: estante || null,
        atributos
      };

      // Ubicación GPS: si marcó una nueva, esa; si tocó "quitar", la borramos;
      // si no tocó nada, dejamos la que ya tenía (no mandamos esos campos)
      if(formGps){
        registro.lat = formGps.lat; registro.lng = formGps.lng; registro.precision_gps = formGps.precision;
      } else if(formQuitarGps){
        registro.lat = null; registro.lng = null; registro.precision_gps = null;
      }

      // Subimos foto/pdf solo si eligió un archivo nuevo
      if(formFotoFile){
        const url = await subirArchivo(formFotoFile, "fotos");
        if(url) registro.foto_url = url;
      }
      if(formPdfFile){
        const url = await subirArchivo(formPdfFile, "pdf");
        if(url) registro.pdf_url = url;
      }

      let error;
      if(formModo === "editar"){
        ({ error } = await db.from("productos").update(registro).eq("id", formProductoId));
      } else {
        ({ error } = await db.from("productos").insert(registro));
      }

      if(error){ alert("No se pudo guardar el producto: " + error.message); return; }

      cerrarForm();
      await cargarProductos();
      construirFiltros();
      filtrar();
    }

    async function eliminarProducto(id){
      const producto = productos.find(p => p.id === id);
      if(!producto) return;
      const confirmar = confirm(`¿Eliminar "${producto.nombre}"? Esta acción no se puede deshacer.`);
      if(!confirmar) return;

      const { error } = await db.from("productos").delete().eq("id", id);
      if(error){ alert("No se pudo eliminar: " + error.message); return; }

      await cargarProductos();
      construirFiltros();
      filtrar();
    }

    /* =====================================================================
       ESCÁNER DE CÓDIGO DE BARRAS
       ===================================================================== */
    async function abrirScanner(){
      if(!("BarcodeDetector" in window)){ alert("Este navegador no soporta lectura de cámara. Podés escribir el código manualmente."); return; }
      const overlay = document.createElement("div");
      overlay.className = "scan-overlay";
      overlay.innerHTML = `<video id="video-scan" autoplay playsinline></video><p>Apuntá al código de barras</p><button onclick="cerrarScanner()">Cancelar</button>`;
      document.body.appendChild(overlay);
      const video = document.getElementById("video-scan");
      try{
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = stream;
        window._streamActivo = stream;
        const detector = new BarcodeDetector({ formats: ["ean_13", "code_128", "upc_a"] });
        window._intervaloScan = setInterval(async () => {
          try{
            const codigos = await detector.detect(video);
            if(codigos.length > 0){
              document.getElementById("input-busqueda").value = codigos[0].rawValue;
              cerrarScanner();
              filtrar();
            }
          }catch(err){}
        }, 400);
      }catch(err){
        alert("No se pudo acceder a la cámara.");
        cerrarScanner();
      }
    }
    function cerrarScanner(){
      clearInterval(window._intervaloScan);
      if(window._streamActivo) window._streamActivo.getTracks().forEach(track => track.stop());
      const overlay = document.querySelector(".scan-overlay");
      if(overlay) overlay.remove();
    }

    if("serviceWorker" in navigator){
      window.addEventListener("load", () => navigator.serviceWorker.register("service-worker.js"));
    }
  </script>
</body>
</html>
